spring:
  application:
    name: dashboard-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

server:
  port: 8093

internal:
  service-secret: ${DASHBOARD_SERVICE_SECRET}

jwt:
  secret: ${JWT_SECRET}