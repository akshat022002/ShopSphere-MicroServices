server:
  port: 8084

spring:
  application:
    name: wishlist-service

  datasource:
    url: jdbc:postgresql://localhost:5434/shopsphere_wishlist
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}

