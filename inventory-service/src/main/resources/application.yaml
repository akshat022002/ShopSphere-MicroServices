spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:postgresql://localhost:5434/shopsphere_inventory
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 8082

internal:
  service-secret: ${INVENTORY_SERVICE_SECRET}
