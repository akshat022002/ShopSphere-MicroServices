server:
  port: 8086

spring:
  application:
    name: coupon-service

  datasource:
    url: jdbc:postgresql://localhost:5434/shopsphere_coupon
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
